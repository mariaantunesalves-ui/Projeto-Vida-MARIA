<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>

        <div class="conteudo">
            <div class="botoes">
                <button class="botao ativo">Concluir o Enino Médio</button>
                <button class="botao">Entrar na Faculdade</button>
                <button class="botao">Completar a maioridade</button>
                <button class="botao">Fazer a carta</button>
            </div>

            <div class="abas-textos">
                <div class="aba-conteudo ativo">
                    <h3 class="aba-conteudo-titulo-principal">Concluir o Enino Médio</h3>
                    <h4 class="aba-conteudo-titulo-secundario"> Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Entrar na Faculdade</h3>
                    <h4 class="aba-conteudo-titulo-secundario"> Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Completar a maioridade</h3>
                    <h4 class="aba-conteudo-titulo-secundario"> Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Fazer a carta</h3>
                    <h4 class="aba-conteudo-titulo-secundario"> Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>
            </div>
        </div>

    </section>
    <script src="main.js"></script>
</body>

</html>
